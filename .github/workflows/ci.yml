name: CI

on:
  push:
    # `claude/**` là các nhánh phiên Claude Code làm việc trên repo này. Chúng luôn đẩy commit
    # lên TRƯỚC rồi mới mở PR, mà lúc đó chưa có PR nên `pull_request` không bắt được.
    branches: [ main, 'claude/**' ]
  # BẮT BUỘC giữ: PR từ fork KHÔNG sinh sự kiện `push` ở repo này, chỉ `pull_request` mới bắt được.
  pull_request:
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Byte-compile verification
        run: python -m compileall -q server system/plugins

      - name: Route integrity check
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd server
          python -c "import main; print(f'Routes loaded successfully: {len(main.app.routes)} endpoints')"

      - name: Run Python test suite
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: server:.
        run: |
          status=0
          for f in tests/python/test_*.py; do
            echo "==== $(basename "$f") ===="
            python "$f" || status=1
          done
          exit $status

  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Dashboard JS tests
        run: |
          status=0
          for f in tests/js/test_*.js tests/js/test_*.mjs; do
            if [ -f "$f" ]; then
              echo "==== $(basename "$f") ===="
              node "$f" || status=1
            fi
          done
          exit $status

      - name: Build Ops Dashboard (Vite + React)
        run: |
          cd ops
          npm install
          npm run build
